# crow-nest CI, issue #50, parent #1
#
# READ THIS BEFORE TRUSTING A GREEN CHECK
# - No job here runs on a GPU: ubuntu-latest has no NVIDIA device and no CUDA toolkit.
# - A green run is a statement about the build and the host-side tests only, never about decode correctness.
# - Excluded on the runner: the 10 tests that load ../models/Qwen3.8-Flash-Next-original/tokenizer.json,
#   because models/ is gitignored and a fresh clone has no weights (skip list in the test job).
#
# Why the engine builds without CUDA:
# - No build.rs in engine/ or converter/.
# - Kernels are compiled at runtime through cudarc::nvrtc::compile_ptx_with_opts (engine/src/cuda.rs:212).
# - cudarc = "=0.19.9" with feature dynamic-loading (engine/Cargo.toml:17); cudarc documents
#   dynamic-loading as loading CUDA at runtime, with no libraries needed at build time (cudarc README,
#   section Configuring linking).
# - Unmeasured: this repo has never built on a machine without CUDA. The local proof of 2026-09-11 ran on
#   a host that has CUDA 13.3 installed. The first honest measurement is the first run of this workflow.
#
# The runner moved from windows-latest to ubuntu-latest with the Linux port (2026-09-17): the step
# bodies were already `shell: bash` and needed no change, only the four `runs-on:` values.
#
# Local proof, 2026-09-11, rustc 1.97.0 (2d8144b78 2026-07-07), x86_64-pc-windows-msvc:
# - build engine exit 0, build converter exit 0
# - test engine: lib 72 passed of 80 (8 filtered), bin serve 55 passed of 57 (2 filtered), other bins 0
# - test converter: 7 passed of 7
# - clippy -D warnings: engine exit 101 (1303 warnings), converter exit 101 (11 warnings)
# - guards: check_env_docs.py exit 0, check_readme_dates.py exit 0
#
# Conventions:
# - Actions pinned by major tag, never @main; the toolchain pinned to the version the repo was measured with.
# - --target-dir target_ci everywhere, so the CI commands are byte for byte the ones proven locally;
#   **/target*/ is gitignored, so nothing from a build can be committed by accident.
# - Step logs (test and clippy output) are teed into target_ci/ for the same reason.

name: ci

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      # Swatinem/rust-cache keys on the lockfiles and the toolchain by itself.
      # Chosen over actions/cache because this repo has two crates and no workspace:
      # engine/Cargo.lock and converter/Cargo.lock are separate, and the arrow form
      # names the non-default target dir per crate.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target_ci
            converter -> target_ci
      - name: toolchain in the summary
        shell: bash
        run: |
          {
            echo "### build"
            echo ""
            echo "- runner: ubuntu-latest, no GPU"
            echo "- $(cargo --version)"
            echo "- $(rustc --version)"
            echo "- target: $(rustc -vV | grep '^host:' | cut -d' ' -f2)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: engine build
        working-directory: engine
        shell: bash
        run: cargo build --release --target-dir target_ci
      - name: converter build
        working-directory: converter
        shell: bash
        run: cargo build --release --target-dir target_ci

  test:
    name: test (host side only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target_ci
            converter -> target_ci
      # Skip list, measured 2026-09-11.
      # Reason for all 10: they load ../models/Qwen3.8-Flash-Next-original/tokenizer.json
      # (and its sibling tokenizer_config.json) with .expect("tokenizer loads").
      # models/ is line 2 of .gitignore, so a fresh clone has no such file and every one of them panics.
      # 8 in engine/src/tokenizer.rs, through the helper tk() at :382:
      #   ascii_round_trips_through_encode_and_decode
      #   utf8_round_trips_through_encode_and_decode
      #   chat_render_ends_with_the_assistant_header_and_the_empty_think_block
      #   enable_thinking_and_add_generation_prompt_are_template_variables
      #   a_tools_render_does_not_fail
      #   a_tools_render_is_byte_identical_to_the_oracle
      #   an_empty_message_list_is_a_template_error_not_a_panic
      #   the_stop_token_resolves
      # 2 in engine/src/bin/serve.rs, loading the tokenizer inline at :3075 and :3246:
      #   a_split_multibyte_token_never_reaches_a_chunk
      #   a_history_with_a_tool_turn_renders_byte_identical_to_the_oracle
      # Not skipped, checked 2026-09-11: engine/src/slot.rs the_load_id_separates_two_containers
      # passes "converter/M.cnq" to load_id (engine/src/slot.rs:368), which hashes the string
      # and opens no file.
      # Expected denominators on the runner:
      #   engine lib     72 of 80 ( 8 filtered)
      #   engine serve   55 of 57 ( 2 filtered)
      #   engine other bins 0 of 0
      #   converter      12 of 12   (7 of 2026-09-11 plus the five of #76, 2026-09-18:
      #                              the four in `requant_check.rs` that pin the block
      #                              comparison and the selection rule, and the one that
      #                              pins the f32 global scale through the index JSON)
      # 2026-09-23 (robin's decision, release-2026-09-23): 26 more tests read models/
      # (config.json, tokenizer.json: meta, tokenizer, toolgrammar real-vocabulary tests) or
      # load NVRTC (kernels compile test). The runner has neither; the test job was red on
      # main since 2026-09-18. They stay covered by the local gate (tools/gate-linux.sh).
      # 2026-09-23: the engine tests read the model's config and tokenizer (meta, tokenizer,
      # toolgrammar) and compile the kernels with NVRTC. The runner has no models/ (gitignored)
      # and no CUDA, so 26 tests failed on every run since 2026-09-18. Fetch ONLY the small
      # non-weight files from the public upstream repo, pinned by sha256 (identical to the
      # files the local gate uses), and NVRTC 13 from PyPI. No weights are downloaded.
      - name: model config, tokenizer and NVRTC for the host tests
        shell: bash
        run: |
          set -euo pipefail
          d=models/Qwen3.8-Flash-Next-original
          mkdir -p "$d"
          while read -r sum f; do
            curl -fsSL --retry 3 -o "$d/$f" "https://huggingface.co/Qwen/Qwen3.8-Flash-Next/resolve/main/$f"
            echo "$sum  $d/$f" | sha256sum -c -
          done <<'SUMS'
          889658f2508e8c61d409b02e70e0d78d8d4452ec65aaafbe129805d213d2e74b config.json
          e70c136c1b78ddc1fb0905bac8e733a4dc448d4f852a5dd75143fffc70be550e generation_config.json
          0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3 tokenizer.json
          b11349aafa7cdc6a320767cf7ceb29ed82f7eda5d65e8e0819e76f0ce947bf27 tokenizer_config.json
          c3cf9e34abf4f9e36c2d72165aa9c132d3e2a725b6c2586aaa3a8af9d7a81041 chat_template.jinja
          a9d356d7bdf1ef4949e3e748e95b8e10ad9d4e2e838eddc38a0a7b6b94d1db8d merges.txt
          ce99b4cb2983d118806ce0a8b777a35b093e2000a503ebde25853284c9dfa003 vocab.json
          SUMS
          python3 -m pip install --quiet "nvidia-cuda-nvrtc==13.*"
          loc=$(python3 -m pip show nvidia-cuda-nvrtc | awk '/^Location:/{print $2}')
          so=$(find "$loc/nvidia" -name 'libnvrtc.so*' | head -1)
          test -n "$so"
          lib=$(dirname "$so")
          ls "$lib"
          echo "LD_LIBRARY_PATH=$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: engine tests
        working-directory: engine
        shell: bash
        run: |
          mkdir -p target_ci
          cargo test --release --target-dir target_ci -- \
            --skip ascii_round_trips_through_encode_and_decode \
            --skip utf8_round_trips_through_encode_and_decode \
            --skip chat_render_ends_with_the_assistant_header_and_the_empty_think_block \
            --skip enable_thinking_and_add_generation_prompt_are_template_variables \
            --skip a_tools_render_does_not_fail \
            --skip a_tools_render_is_byte_identical_to_the_oracle \
            --skip an_empty_message_list_is_a_template_error_not_a_panic \
            --skip the_stop_token_resolves \
            --skip a_split_multibyte_token_never_reaches_a_chunk \
            --skip a_history_with_a_tool_turn_renders_byte_identical_to_the_oracle \
            --skip a_doctored_eps_fires_by_name \
            --skip a_doctored_head_dim_fires_scale_and_pairs_and_head_dim \
            --skip a_doctored_hidden_size_fires_by_name \
            --skip a_doctored_layer_count_and_layout_fire_by_name \
            --skip a_doctored_partial_rotary_fires_rope_pairs \
            --skip a_doctored_rope_type_fires_by_name \
            --skip a_doctored_theta_fires_by_name \
            --skip a_legacy_typed_rope_scaling_takes_the_defaults \
            --skip a_missing_field_is_a_named_error \
            --skip a_random_walk_over_allowed_ids_never_reaches_a_dead_end \
            --skip a_yarn_rope_scaling_parses_with_the_reference_math \
            --skip an_out_of_range_special_id_is_a_named_mismatch \
            --skip an_unsupported_rope_scaling_type_is_a_named_error \
            --skip doctored_generation_ids_fire_by_name \
            --skip doctored_head_counts_fire_gqa_and_the_pins \
            --skip doctored_vocab_and_positions_fire_by_name \
            --skip linear_and_ntk_parse_with_no_mscale \
            --skip mask_cost_on_cpu \
            --skip reasoning_effort_is_a_template_variable_and_undefined_is_the_default \
            --skip the_container_convention_finds_the_repo_checkpoint \
            --skip the_observed_failure_shapes_are_masked_on_the_real_vocabulary \
            --skip the_real_config_has_no_scaling_and_a_default_rope_type \
            --skip the_real_config_passes_every_check \
            --skip the_source_compiles_and_the_scale_split_is_visible_in_the_ptx \
            --skip token_bytes_concatenate_to_the_exact_text \
            --skip token_masks_on_the_real_vocabulary_agree_with_the_per_token_check \
            2>&1 | tee target_ci/engine-tests.txt
          {
            echo "### test: engine"
            echo ""
            echo "- 36 tests skipped, no weights / no NVRTC on the runner"
            echo '```'
            grep -E '^(     Running|   Doc-tests|test result:)' target_ci/engine-tests.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: converter tests
        working-directory: converter
        shell: bash
        run: |
          mkdir -p target_ci
          cargo test --release --target-dir target_ci 2>&1 | tee target_ci/converter-tests.txt
          {
            echo "### test: converter"
            echo ""
            echo '```'
            grep -E '^(     Running|   Doc-tests|test result:)' target_ci/converter-tests.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: clippy (non-blocking, see count)
    runs-on: ubuntu-latest
    # Non-blocking by decision of 2026-09-11: the measured count is 1314 warnings
    # (engine 1303, converter 11), so -D warnings cannot gate anything yet.
    # Flip continue-on-error to false once the count is 0. No source change in #50.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            engine -> target_ci
            converter -> target_ci
      # Local counts of 2026-09-11, dominant lints in the engine:
      #   unnecessary_cast 1085, missing_safety_doc 87, manual_div_ceil 52,
      #   manual_is_multiple_of 14, needless_range_loop 12, rest below 6 each.
      # The converter measured 13 on this machine on 2026-09-18, against the 11 noted above
      # for 2026-09-11; where those two come from was not investigated. #76 added NONE of
      # them: `src/requant_check.rs` produces no clippy warning.
      - name: engine clippy
        working-directory: engine
        shell: bash
        run: |
          mkdir -p target_ci
          cargo clippy --release --target-dir target_ci --all-targets 2>&1 | tee target_ci/clippy-engine.txt
          total=$(grep -cE '^warning: ' target_ci/clippy-engine.txt || :)
          summ=$(grep -cE '^warning: .crow-nest-engine.' target_ci/clippy-engine.txt || :); total=${total:-0}; summ=${summ:-0}
          echo "- engine clippy warnings: $((total - summ)) (local 2026-09-11: 1303)" >> "$GITHUB_STEP_SUMMARY"
          cargo clippy --release --target-dir target_ci --all-targets -- -D warnings || echo "clippy non-blocking: above the 2026-09-11 baseline (11), see the count above" || echo "clippy non-blocking: above the 2026-09-11 baseline (1303), see the count above"
      - name: converter clippy
        working-directory: converter
        shell: bash
        run: |
          mkdir -p target_ci
          cargo clippy --release --target-dir target_ci --all-targets 2>&1 | tee target_ci/clippy-converter.txt
          total=$(grep -cE '^warning: ' target_ci/clippy-converter.txt || :)
          summ=$(grep -cE '^warning: .converter.' target_ci/clippy-converter.txt || :); total=${total:-0}; summ=${summ:-0}
          echo "- converter clippy warnings: $((total - summ)) (local 2026-09-11: 11)" >> "$GITHUB_STEP_SUMMARY"
          cargo clippy --release --target-dir target_ci --all-targets -- -D warnings

  guards:
    name: doc guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Both must exit 0. No third party package is needed; both scripts use the standard library.
      - name: check_env_docs
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_env_docs.py
      - name: check_readme_dates
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_readme_dates.py
